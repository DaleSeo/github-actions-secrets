name: Config

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 변수 읽기
        run: |
          echo "APP_NAME: ${{ vars.APP_NAME }}"
          echo "LOG_LEVEL: ${{ vars.LOG_LEVEL }}"
      - name: 시크릿 읽기
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "API_KEY: $API_KEY"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: 환경별 값 읽기
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "LOG_LEVEL: ${{ vars.LOG_LEVEL }}"
          echo "API_KEY 길이: ${#API_KEY}"
